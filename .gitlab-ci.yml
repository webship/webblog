include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  DRUPAL_CORE: "~11.2.0"
  COMPOSER_MEMORY_LIMIT: "-1"
  COMPOSER_ALLOW_SUPERUSER: "1"

composer:
  stage: build
  image: php:8.3
  before_script:
    - apt-get update && apt-get install -y git unzip zip libzip-dev
    - docker-php-ext-install zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer --version
  script:
    - composer validate --no-check-all --ansi
    - composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader
    - composer require drush/drush --no-interaction || true
  artifacts:
    paths:
      - vendor/
    expire_in: 1 hour
  allow_failure: false
cspell:
  stage: validate
  image: node:18
  before_script:
    - npm install -g cspell
  script:
    - cspell "**/*.{php,module,inc,install,test,profile,theme,js,css,md,yml,txt}" --no-progress || true
  allow_failure: true

eslint:
  stage: validate
  image: node:18
  before_script:
    - corepack enable
    - yarn install
  script:
    - yarn lint:js || true
    - yarn lint:yaml || true
  after_script:
    - touch junit.xml _eslint.patch
  allow_failure: true

stylelint:
  stage: validate
  image: node:18
  before_script:
    - corepack enable
    - yarn install
  script:
    - yarn lint:css || true
  after_script:
    - echo '[]' > gl-codequality.json
  allow_failure: true
