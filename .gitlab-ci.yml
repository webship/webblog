image: node:20

stages:
  - install
  - test

cache:
  paths:
    - node_modules/

before_script:
  - npm install -g webship-js
  - npm install

install_dependencies:
  stage: install
  script:
    - echo "Installing project dependencies..."
    - npm install
  artifacts:
    paths:
      - node_modules/

run_webship_tests:
  stage: test
  script:
    - echo "Running Webship-JS tests..."
    - npx webship run
