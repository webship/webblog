image: php:8.2-fpm

variables:
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: drupal
  MYSQL_USER: drupal
  MYSQL_PASSWORD: drupal
  SIMPLETEST_BASE_URL: "http://localhost:8080"
  BROWSERTEST_OUTPUT_DIRECTORY: "$CI_PROJECT_DIR/artifacts/test-results"
  DRUPAL_VERSION: "10.2.2"

services:
  - mysql:8
  - name: selenium/standalone-chrome:latest
    alias: selenium

stages:
  - build
  - test
  - selenium_tests

before_script:
 
  - apt-get update && apt-get install -y unzip git curl sqlite3 mariadb-client libpng-dev libjpeg-dev libonig-dev libxml2-dev libzip-dev libpq-dev libfreetype6-dev libjpeg62-turbo-dev libmcrypt-dev libxslt-dev
  - docker-php-ext-install pdo pdo_mysql mysqli gd mbstring xml zip opcache
  - curl -sS https://getcomposer.org/installer | php
  - php composer.phar install
  - curl -OL https://ftp.drupal.org/files/projects/drupal-${DRUPAL_VERSION}.tar.gz
  - tar -xzvf drupal-${DRUPAL_VERSION}.tar.gz --strip-components=1
  - cp sites/default/default.settings.php sites/default/settings.php
  - mkdir -p sites/default/files
  - chmod -R 777 sites/default

build:
  stage: build
  script:
    
    - ./vendor/bin/drush site:install standard --db-url=mysql://$MYSQL_USER:$MYSQL_PASSWORD@mysql/$MYSQL_DATABASE -y
    - ./vendor/bin/drush en webblog -y
  artifacts:
    paths:
      - sites/default/files
      - sites/default/settings.php

test:
  stage: test
  script:
    
    - ./vendor/bin/phpunit modules/contrib/webblog/tests/src/Functional
  artifacts:
    when: always
    paths:
      - artifacts/test-results
    reports:
      junit: artifacts/test-results/junit.xml

selenium_tests:
  stage: selenium_tests
  script:
    
    - ./vendor/bin/drush test-run --url=http://selenium:4444/wd/hub modules/contrib/webblog/tests/src/Functional
  artifacts:
    when: always
    paths:
      - artifacts/test-results/selenium
    reports:
      junit: artifacts/test-results/selenium/junit.xml
