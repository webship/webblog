stages:
  - build
  - lint
  - test

variables:
  COMPOSER_MEMORY_LIMIT: "-1"
  NODE_ENV: test
  SIMPLETEST_BASE_URL: "http://localhost"

default:
  image: node:20

before_script:
  - apt-get update && apt-get install -y curl php php-cli php-mbstring php-xml php-mysql mysql-client git
  - npm install -g yarn
  - yarn install
  - yarn run webship:install

build:
  stage: build
  script:
    - echo "Building project dependencies..."
    - yarn install
  artifacts:
    paths:
      - node_modules/

lint:
  stage: lint
  script:
    - echo "Checking linting for Webship-JS tests..."
    - yarn run lint

webship-tests:
  stage: test
  script:
    - echo "Executing Webship-JS automated tests..."
    - yarn test
  artifacts:
    when: always
    paths:
      - reports/
